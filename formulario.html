<form action="reservar.php" method="post">
 
  <label for="nombre">Nombre completo</label>
  <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>

  <label for="email">Correo electrónico</label>
  <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>

  <label for="telefono">Teléfono</label>
  <input type="tel" id="telefono" name="telefono" placeholder="+34 600 000 000">

 
  <label for="fecha">Fecha de reserva</label>
  <input type="date" id="fecha" name="fecha" required>

  <label for="personas">Número de personas</label>
  <input type="number" id="personas" name="personas" min="1" max="20" value="2" required>

  
  <label for="mensaje">Mensaje o peticiones especiales</label>
  <textarea id="mensaje" name="mensaje" rows="4" placeholder="Alergias, preferencia de mesa..."></textarea>

  <button type="submit">Confirmar Reserva</button>
</form>
